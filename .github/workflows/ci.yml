name: Website checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: site-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python scripts/check_source.py
      - run: npm run check && npm run validate && npm test
      - run: python -m unittest discover -s integration -p 'test_*.py'
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: python scripts/build_release.py --ref HEAD --output artifacts/site.tar
      - uses: actions/upload-artifact@v4
        with:
          name: website-${{ github.sha }}
          path: artifacts/site.tar
          retention-days: 14
